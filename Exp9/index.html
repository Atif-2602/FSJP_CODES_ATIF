<!-- Aim: WAP to create a webpage that automatically changes the background color every
       5 seconds using the Document Object Model (DOM) and the setInterval() function.
<!-- Name: Qureshi Atif Meraj Alam | UIN: 251P004 | Class: S.E.Computer A -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp 9 - DOM Background Color Change</title>
    <style>
        body {
            text-align: center;
            background-color: salmon;
            font-family: Arial, sans-serif;
            transition: background-color 0.8s ease;
        }
        h1 { margin-top: 120px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.4); }
        p  { color: white; font-size: 18px; }
        #colorName { font-weight: bold; font-size: 22px; }
        button {
            margin-top: 25px; padding: 12px 25px; font-size: 16px;
            background: rgba(255,255,255,0.85); border: none; border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: white; }
    </style>
</head>
<body>
    <h1>Background Color Changer using DOM</h1>
    <p>Current Color: <span id="colorName">salmon</span></p>
    <p>The background changes automatically after every 5 seconds.</p>

    <button onclick="changeBGColor()">Change Background Now</button>

    <script>
        // array of colors
        const colors = ["red", "blue", "green", "yellow", "orange",
                        "purple", "salmon", "teal", "crimson"];

        // IMPLICIT OBJECT: document — used to access HTML elements (DOM)
        const bodyElem = document.body;
        const colorNameElem = document.getElementById("colorName");

        let index = 0;

        function changeBGColor() {
            index = (index + 1) % colors.length;

            // DOM manipulation: change CSS backgroundColor property
            bodyElem.style.backgroundColor = colors[index];

            // update the displayed color name
            colorNameElem.innerText = colors[index];
        }

        // setInterval() — executes changeBGColor() repeatedly every 5000 ms (5 seconds)
        setInterval(changeBGColor, 5000);
    </script>
</body>
</html>
